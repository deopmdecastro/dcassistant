services:
  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dcassistant
      POSTGRES_USER: dcassistant
      POSTGRES_PASSWORD: dcassistant_local
    ports:
      - "5432:5432"
    volumes:
      - dcassistant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcassistant -d dcassistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dcassistant_data:
